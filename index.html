<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the document character set. -->
    <meta charset="UTF-8">
    <!-- Keeps the canvas and controls responsive on different screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the browser tab title. -->
    <title>WebGL 3D Text Animation</title>
    <!-- Loads the visual styling for the application. -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Contains the WebGL canvas and its overlay controls. -->
    <main class="app">
        <!-- WebGL draws the extruded USM logo into this canvas. -->
        <canvas id="glCanvas" aria-label="Animated 3D text"></canvas>
        <!-- Provides user controls for the logo animation and appearance. -->
        <section class="controls" aria-label="Animation controls">
            <!-- Displays the hardcoded logo name beside the controls. -->
            <div class="logo-name" aria-label="Logo text">USM</div>
            <label>
                <!-- Selects the complete sequence or one animation phase. -->
                Animation
                <select id="animationInput">
                    <option value="all">Main sequence</option>
                    <option value="right">Rotate right 180°</option>
                    <option value="rightReturn">Return from right</option>
                    <option value="left">Rotate left 180°</option>
                    <option value="leftReturn">Return from left</option>
                    <option value="scale">Scale up</option>
                    <option value="scaleDown">Scale down</option>
                    <option value="move">Move about</option>
                </select>
            </label>
            <label>
                <!-- Selects the front-face colour of the logo. -->
                Colour
                <input id="colorInput" type="color" value="#9b59ff">
            </label>
            <label>
                <!-- Controls the thickness of the 3D extrusion. -->
                Depth
                <input id="depthInput" type="range" min="0.05" max="0.8" step="0.01" value="0.2">
                <output id="depthValue">0.20</output>
            </label>
            <label>
                <!-- Controls how quickly the animation timeline advances. -->
                Speed
                <input id="speedInput" type="range" min="0.25" max="3" step="0.05" value="1">
                <output id="speedValue">1.00x</output>
            </label>
            <!-- Groups the animation playback buttons. -->
            <div class="buttons">
                <!-- Pauses or resumes the animation. -->
                <button id="playButton" type="button">Pause</button>
                <!-- Restarts the animation from its first phase. -->
                <button id="restartButton" type="button">Reset</button>
            </div>
        </section>
    </main>
    <!-- Loads geometry and colour helpers before the main WebGL program. -->
    <script src="extrusion.js"></script>
    <!-- Loads shader setup, animation, rendering, and event handling. -->
    <script src="main.js"></script>
</body>
</html>
